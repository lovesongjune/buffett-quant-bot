name: Buffett Quant Auto Trading Bot

on:
  # 매주 월요일 아침 09:05 KST (UTC 00:05)에 자동 실행
  schedule:
    - cron: '5 0 * * 1'
  # GitHub 웹 화면에서 수동으로 'Run workflow' 버튼을 눌러 즉시 실행도 가능
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.12 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필수 라이브러리 설치
        run: |
          pip install -r requirements.txt

      - name: 앙상블 자동매매 봇 실행
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY || secrets.MIRAE_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET || secrets.MIRAE_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO || secrets.MIRAE_ACCOUNT_NO }}
          KIS_ACCOUNT_CODE: ${{ secrets.KIS_ACCOUNT_CODE || secrets.MIRAE_ACCOUNT_CODE || '01' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python trading_bot.py
